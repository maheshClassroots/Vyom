<!doctype html><html><body style="background:#222;color:#eee;font-family:system-ui;padding:10px">
<canvas id="c" width="360" height="360" style="border:1px solid #555"></canvas>
<pre id="o">capturing…</pre>
<script type="module">
import { Rive, Layout, Fit, Alignment } from '@rive-app/canvas';
const SIZE = 360, FPS = 25, SECONDS = 6;
const canvas = document.getElementById('c');
const out = document.getElementById('o');
const log = (m) => { out.textContent += '\n' + m; };

// Small perceptual signature per frame, used to find where the idle loops.
const sigCanvas = document.createElement('canvas');
sigCanvas.width = sigCanvas.height = 24;
const sctx = sigCanvas.getContext('2d', { willReadFrequently: true });
function signature() {
  sctx.clearRect(0, 0, 24, 24);
  sctx.drawImage(canvas, 0, 0, 24, 24);
  const d = sctx.getImageData(0, 0, 24, 24).data;
  const v = [];
  for (let i = 0; i < d.length; i += 4) v.push(d[i] * 0.3 + d[i+1] * 0.59 + d[i+2] * 0.11, d[i+3]);
  return v;
}
const dist = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; } return Math.sqrt(s / a.length); };

const rive = new Rive({
  src: '/sparkrigfinalallanimations.riv', canvas, artboard: 'Spark',
  stateMachines: 'Spark', autoplay: true, autoBind: true,
  layout: new Layout({ fit: Fit.Contain, alignment: Alignment.Center }),
  onLoad: () => setTimeout(run, 1200),
});

async function run() {
  const frames = [], sigs = [];
  const step = 1000 / FPS, total = FPS * SECONDS;
  let last = performance.now();
  for (let i = 0; i < total; i++) {
    await new Promise((res) => {
      const tick = () => {
        if (performance.now() - last >= step) { last = performance.now(); res(); }
        else requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
    frames.push(canvas.toDataURL('image/webp', 0.9));
    sigs.push(signature());
  }
  log(`captured ${frames.length} frames`);
  const nonEmpty = sigs[0].some((v) => v > 1);
  log(`signature non-empty: ${nonEmpty}`);

  // Loop point: the later frame most similar to frame 0, at least 0.6s in.
  const min = Math.round(FPS * 0.6);
  let best = -1, bestD = Infinity;
  for (let i = min; i < sigs.length; i++) {
    const d = dist(sigs[0], sigs[i]);
    if (d < bestD) { bestD = d; best = i; }
  }
  const drift = sigs.slice(1).map((s) => dist(sigs[0], s));
  const maxDrift = Math.max(...drift);
  log(`loop at frame ${best} (dist ${bestD.toFixed(2)}), max drift ${maxDrift.toFixed(2)}`);
  const looped = frames.slice(0, best);
  log(`sending ${looped.length} frames (${(looped.join('').length / 1024).toFixed(0)} KB)`);
  await fetch('http://localhost:5299/save', {
    method: 'POST',
    body: JSON.stringify({ fps: FPS, size: SIZE, loopFrame: best, loopDist: bestD, maxDrift, frames: looped }),
  });
  log('sent');
}
</script></body></html>
