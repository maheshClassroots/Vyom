          <div class="gp-progress" data-open="{{ progOpen }}" data-done="{{ progDoneAll }}" onClick="{{ toggleProg }}" role="button" tabindex="0" aria-expanded="{{ progOpen }}" style="position:{{ progCardPos }};right:28px;bottom:36px;z-index:35;">
            <div class="gp-mountain" data-gp-progress="{{ progW }}" aria-hidden="true"></div>
            <div class="gp-body">
              <div class="gp-head">
                <span class="gp-eyebrow"><span class="gp-eyebrow-closed">Your progress</span><span class="gp-eyebrow-open">Chapter view</span></span>
                <span class="gp-toggle" aria-hidden="true"><i class="ti ti-chevron-up"></i></span>
              </div>
              <div class="gp-rows"><div class="gp-rows-in">
                <sc-for list="{{ progRows }}" as="c" hint-placeholder-count="3">
                  <div class="gp-row">
                    <div class="gp-row-head"><span class="gp-row-name">{{ c.name }}</span><span class="gp-row-count">{{ c.label }}</span></div>
                    <div class="gp-track"><div class="gp-fill" style="width:{{ c.w }};"></div></div>
                  </div>
                </sc-for>
              </div></div>
              <div class="gp-count-wrap">
                <span class="gp-count">{{ progDone }} of {{ progTotal }}</span>
                <span class="gp-sub">{{ progSub }}</span>
              </div>
            </div>
          </div>
