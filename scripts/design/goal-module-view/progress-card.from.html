          <div style="position:{{ progCardPos }};right:80px;bottom:44px;z-index:35;width:{{ progCardW }};box-sizing:border-box;padding:20px 22px;border-radius:24px;background:rgba(243,240,255,.97);box-shadow:inset 0 0 0 1px rgba(112,72,232,.12),0 12px 30px -18px rgba(70,46,146,.35);display:flex;flex-direction:column;gap:20px;">

                <circle cx="27" cy="27" r="23.875" fill="none" stroke="rgba(28,126,214,.14)" stroke-width="6.25"></circle>
                <circle cx="27" cy="27" r="23.875" fill="none" stroke="#1c7ed6" stroke-width="6.25" stroke-linecap="round" stroke-dasharray="{{ progDash }}"></circle>
              </svg>
              <div style="flex:none;display:flex;flex-direction:column;gap:5px;">
                <span style="font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7048e8;white-space:nowrap;">Your progress</span>
                <span style="font-size:18px;font-weight:700;color:#211a4a;white-space:nowrap;">{{ progDone }} of {{ progTotal }} topics covered</span>

              <span style="width:16px;height:28px;flex:none;display:grid;place-items:center;color:#7048e8;"><i class="ti {{ progChev }}" style="font-size:16px;"></i></span>
